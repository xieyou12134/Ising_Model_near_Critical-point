[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ising-scale-diffusion"
version = "0.1.0"
description = "Small-scale critical Ising absorbing-diffusion Transformer training"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ising-train = "ising_scale_diffusion.cli:train_main"
ising-sample = "ising_scale_diffusion.cli:sample_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
