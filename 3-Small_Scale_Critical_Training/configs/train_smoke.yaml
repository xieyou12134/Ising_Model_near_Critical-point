run:
  id: critical_small_scale_smoke
  output_dir: ../outputs/critical_small_scale_smoke
  seed: 2026080910

data:
  root: ../../1-Monte_Carlo
  train_manifest: ../../1-Monte_Carlo/manifests/smoke/parents.csv
  train_split: smoke
  validation_manifest: null
  validation_split: smoke
  widths: [16]
  batch_size: 2
  seed: 2026080911

model:
  dim: 64
  depth: 2
  heads: 4
  mlp_ratio: 4.0
  dropout: 0.0
  qk_norm: true
  rope_base: 10000.0
  condition_on_beta: false
  fixed_beta: 0.44068679350977147

objective:
  t_min: 0.2
  t_max: 1.0

training:
  steps: 20
  gradient_accumulation: 1
  learning_rate: 0.0003
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 2
  min_lr_ratio: 0.1
  gradient_clip: 1.0
  precision: fp32
  device: auto
  log_every: 1
  validate_every: 10
  checkpoint_every: 10

validation:
  t_grid: [0.2, 0.5, 0.8, 1.0]
  batches_per_width: 1
